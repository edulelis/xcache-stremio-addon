services:
  xcache-addon:
    build:
      context: .
      dockerfile: Dockerfile
    image: xcache-stremio-addon:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - qbittorrent
    ports:
      - "7331:7331"
    volumes:
      - xcache-data:/cache
    networks:
      - xcache

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - qbittorrent-config:/config
      - xcache-data:/cache
    expose:
      - "8080"
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - xcache

volumes:
  xcache-data:
  qbittorrent-config:

networks:
  xcache:
